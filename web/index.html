<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo Replay</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <header class="top">
    <a class="brand" href="#/">Repo Replay</a>
    <span id="crumb" class="crumb"></span>
    <span class="spacer"></span>
    <span class="keys muted" aria-hidden="true"><kbd>Ctrl/⌘ ↵</kbd> rodar · <kbd>Ctrl/⌘ K</kbd> tutor · <kbd>Alt ←/→</kbd> etapas</span>
  </header>
  <div class="layout">
    <nav id="journey" class="col nav" aria-label="Etapas da jornada"></nav>
    <main id="main" class="col main" tabindex="-1"></main>
    <aside class="col side" aria-label="Tutor e Toolbox">
      <section id="tutor" class="tutor"></section>
      <section id="toolbox" class="toolbox"></section>
    </aside>
  </div>
</body>
</html>
